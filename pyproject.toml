[project]
name = "project"
version = "0.1.0"
description = "dubizzle cars AI assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "litellm>=1.52.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "faiss-cpu>=1.9.0",
    "numpy>=1.26.0",
    "streamlit>=1.39.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
